<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<title>Overdeck — Tvoříme domov na terase</title>
<meta name="description" content="Demoverze redesignu. Hliníkové pergoly a markýzy na míru.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" href="assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/hero/f000.webp">
<style>
/* ============================================================
   OVERDECK — design tokens
   Night terrace: low-saturated blue-grey ground, cream ink,
   one flame accent that only ever marks an action.
   ============================================================ */
:root{
  --ink:#0E1620;
  --ink-2:#16212E;
  --ink-3:#1F2E3E;
  --ink-deep:#0A1018;
  --cream:#F5EFD7;          /* matches the wordmark in the brand SVG */
  --cream-2:#FFFBEF;
  --dim:rgba(245,239,215,.60);
  --dim-2:rgba(245,239,215,.38);
  --gold:#EBBE5A;           /* primary accent — taken from the logo mark */
  --gold-2:#F5D07E;
  --flame:#FE6237;          /* alternative accent, used sparingly */
  --rule:rgba(245,239,215,.14);
  --rule-ink:rgba(14,22,32,.14);

  /* Gasoek One was the brief, but its latin-ext file has no Ě Ř Ů Š Č Ž —
     those glyphs fall back mid-word and Czech headlines break apart.
     Bungee is the nearest match by weight and width and is caps-first by design.
     Swap this one line for 'Titan One' or 'Archivo Black' if you prefer those. */
  --display:'Bungee',ui-sans-serif,system-ui,sans-serif;
  --sans:'Inter Tight','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --r-card:16px;
  --r-sec:40px;

  --gut:clamp(20px,4vw,64px);
  --pad-y:clamp(72px,9vw,140px);

  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:var(--sans);font-size:17px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* Never set overflow-x on <body>: it turns the body into a scroll container
   and the hero's position:sticky stage silently stops sticking. */
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
/* blockquote carries a UA margin of 1em 40px — it silently shrank the review cards */
h1,h2,h3,h4,p,figure,blockquote{margin:0}
::selection{background:var(--gold);color:var(--ink)}

/* ---------- type ---------- */
/* the display face carries one heavy weight and is always set in caps here,
   so the scale runs smaller than it would for a mixed-case display face */
.display{
  font-family:var(--display);font-weight:400;
  /* caps + Czech carons (Ě Ř Ů Š) need headroom — tighter than this clips them */
  line-height:1.08;letter-spacing:-.005em;text-transform:uppercase;
  text-wrap:balance;
}
/* two display sizes only: the hero, and one shared size for every section heading */
.d-xl{font-size:clamp(34px,5.9vw,100px)}
.d-lg{font-size:clamp(26px,3.7vw,54px)}
.label{
  font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim-2);
}
.lead{font-size:clamp(18px,1.5vw,22px);line-height:1.45;color:var(--dim);max-width:34ch;text-wrap:balance}
.small{font-size:14px;line-height:1.5;color:var(--dim)}

/* ---------- shell ---------- */
.wrap{width:100%;padding-inline:var(--gut)}
.sec{
  position:relative;z-index:var(--z,1);
  border-radius:0 0 var(--r-sec) var(--r-sec);
  padding-block:var(--pad-y);
  scroll-margin-top:0;
}
.sec--tuck{margin-top:calc(var(--r-sec) * -1);padding-top:calc(var(--pad-y) + var(--r-sec))}
/* the CTA sits on the baseline of the heading's LAST line, so a two-line
   display heading no longer pushes it onto a row of its own */
.sec__head{display:flex;flex-wrap:wrap;align-items:last baseline;justify-content:space-between;gap:24px 32px;margin-bottom:clamp(36px,4vw,64px)}
.sec__head > :first-child{flex:1 1 min(100%,26ch);min-width:0}
.sec__head > :last-child{flex:none;margin-left:auto}
.sec__head .label{display:block;margin-bottom:14px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:999px;
  font-size:15px;font-weight:500;letter-spacing:-.01em;
  transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease),border-color .3s var(--ease);
}
.btn:hover{transform:translateY(-2px)}
.btn--fill{background:var(--gold);color:var(--ink)}
.btn--fill:hover{background:var(--gold-2)}
.btn--ghost{border:1px solid var(--rule);color:var(--cream)}
.btn--ghost:hover{border-color:var(--cream);background:rgba(245,239,215,.06)}
.btn--ink{background:var(--ink);color:var(--cream)}
.btn--ink:hover{background:var(--ink-2)}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}

/* ============================================================
   HEADER
   ============================================================ */
/* floating panel: inset from every edge, never a full-bleed bar */
.hdr{
  position:fixed;top:14px;left:var(--gut);right:var(--gut);z-index:80;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:10px 10px 10px 22px;border-radius:var(--r-sec);
  background:rgba(14,22,32,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--rule);
  transition:background .4s var(--ease),border-color .4s var(--ease);
}
.hdr.stuck{background:rgba(14,22,32,.82)}
.logo{display:flex;align-items:center;color:var(--cream)}
.logo__svg{height:26px;width:auto;aspect-ratio:1342.9/231.3;display:block}
.mk{height:22px;width:auto;aspect-ratio:88.7/101.9;display:block;flex:none}
.nav{display:flex;align-items:center;gap:4px}
.nav a{padding:9px 14px;border-radius:999px;font-size:14.5px;color:var(--dim);transition:color .25s,background .25s}
.nav a:hover{color:var(--cream);background:rgba(245,239,215,.07)}
.hdr__side{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px}
.lang button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--dim-2);transition:.25s}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--rule);border-radius:999px;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.burger i{display:block;width:16px;height:1.5px;background:var(--cream)}

/* the header inverts while the cream reviews section sits behind it.
   The logo SVG carries its own cream wordmark, so it gets inverted wholesale. */
.hdr.light{background:rgba(245,239,215,.62);border-color:var(--rule-ink)}
.hdr.light.stuck{background:rgba(245,239,215,.86)}
.hdr.light .logo{color:var(--ink)}
.hdr.light .nav a{color:rgba(14,22,32,.62)}
.hdr.light .nav a:hover{color:var(--ink);background:rgba(14,22,32,.07)}
.hdr.light .lang{border-color:var(--rule-ink)}
.hdr.light .lang button{color:rgba(14,22,32,.45)}
.hdr.light .lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.hdr.light .burger{border-color:var(--rule-ink)}
.hdr.light .burger i{background:var(--ink)}

/* ============================================================
   HERO — scroll-driven frame sequence
   ============================================================ */
.hero{position:relative;z-index:20;height:340vh}
.hero__stage{
  position:sticky;top:0;height:100vh;overflow:hidden;
  border-radius:0 0 var(--r-sec) var(--r-sec);
  background:var(--ink-2);
}
.hero__cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero__veil{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(10,16,24,.62) 0%,rgba(10,16,24,.12) 32%,rgba(10,16,24,.20) 60%,rgba(10,16,24,.86) 100%);
}
.hero__tint{position:absolute;inset:0;pointer-events:none;background:#0A1018;opacity:.18}
.hero__inner{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 var(--gut) clamp(86px,12vh,136px);
}
.hero__copy{position:relative}
.hero__a,.hero__b{will-change:opacity,transform}
.hero__b{position:absolute;inset:auto auto 0 0;width:100%;opacity:0}
.hero h1{margin:18px 0 0;max-width:13ch}
.hero .label{color:rgba(245,239,215,.74)}
.hero__hint{
  position:absolute;left:var(--gut);bottom:clamp(20px,3vh,34px);
  display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim-2);
}
.hero__hint i{display:block;width:26px;height:1px;background:var(--dim-2);transform-origin:left;animation:sweep 2.4s var(--ease) infinite}
@keyframes sweep{0%{transform:scaleX(.2)}50%{transform:scaleX(1)}100%{transform:scaleX(.2)}}
.hero__bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}

/* ============================================================
   PROMO STRIP
   ============================================================ */
/* the tuck hides the first 40px, so the top padding has to pay it back —
   otherwise the numbers sit flush against the top edge of the band */
.promo{
  background:var(--gold);color:var(--ink);
  padding-block:calc(clamp(40px,4.4vw,64px) + var(--r-sec)) clamp(40px,4.4vw,64px);
}
.promo__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,3.4vw,52px)}
.promo__item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.promo__item b{font-size:clamp(26px,3vw,46px);line-height:1;font-weight:400}
.promo__item span{font-size:clamp(14px,1.15vw,17px);color:rgba(14,22,32,.68);max-width:24ch}

/* ============================================================
   OFFER — three cards
   ============================================================ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.5vw,22px)}
/* radius + clipping live on the image alone; clipping the whole card
   shaves the first and last glyphs off the bottom line of copy */
.card{
  background:var(--ink-2);border-radius:var(--r-card);
  display:flex;flex-direction:column;
  transition:background .35s var(--ease),transform .35s var(--ease);
}
.card:hover{background:var(--ink-3);transform:translateY(-4px)}
.card__img{aspect-ratio:4/3;overflow:hidden;background:var(--ink-3);border-radius:var(--r-card) var(--r-card) 0 0}
.card__img img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.card:hover .card__img img{transform:scale(1.05)}
.card__body{padding:clamp(22px,2vw,30px);display:flex;flex-direction:column;gap:22px;flex:1}
.card__row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,1.6vw,26px);align-items:start}
.card__body h3{font-size:clamp(19px,1.5vw,24px);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.card__body p{font-size:15.5px;line-height:1.45;color:var(--dim)}
.card__meta{margin-top:auto;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}

/* ============================================================
   ZASTŘEŠENÍ
   ============================================================ */
/* heading and the two cards share the left half; the photo fills the right half
   top to bottom, its height driven by the column beside it */
.zast{background:var(--ink-2)}
.zast__grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.5vw,22px);align-items:stretch}
.zast__left{display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(28px,3.4vw,56px)}
.zast__cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.5vw,22px)}
.zast__media{position:relative;border-radius:var(--r-card);overflow:hidden;min-height:clamp(300px,32vw,480px)}
.zast__media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.duo__col{
  background:var(--ink);border-radius:var(--r-card);
  padding:clamp(22px,2.2vw,32px);display:flex;flex-direction:column;gap:12px;
  transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease);
}
.duo__col:hover{background:var(--gold);color:var(--ink);transform:translateY(-4px)}
.duo__col h3{font-family:var(--display);font-size:clamp(22px,2.3vw,34px);line-height:1;letter-spacing:-.005em;text-transform:uppercase}
.duo__col p{font-size:15.5px;line-height:1.45;color:var(--dim);transition:color .3s var(--ease)}
.duo__col:hover p{color:rgba(14,22,32,.72)}
.duo__go{margin-top:auto;padding-top:22px;display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);transition:color .3s var(--ease)}
.duo__col:hover .duo__go{color:var(--ink)}
.duo__col:hover .ar{transform:translateX(4px)}
.duo__go .ar{transition:transform .3s var(--ease)}

/* ============================================================
   WORK + STATEMENT
   ============================================================ */
/* same gold band as the benefits strip; pays back the 40px the tuck hides */
.stmt{
  background:var(--gold);color:rgba(14,22,32,.74);
  padding-block:calc(clamp(44px,5vw,76px) + var(--r-sec)) clamp(44px,5vw,76px);
}
/* runs the full width of the band so it lands on two lines, not four with a hole on the right */
.stmt q{quotes:none;display:block;max-width:none;color:rgba(14,22,32,.74);font-size:clamp(22px,3.32vw,50px)}
.stmt q b{color:var(--ink);font-weight:400}
.stmt__by{margin-top:26px;display:flex;align-items:center;gap:12px;font-size:14px;color:rgba(14,22,32,.6)}
.stmt .mk{color:var(--ink)}
.case{position:relative;border-radius:var(--r-card);display:block;background:var(--ink-2)}
.case__img{aspect-ratio:4/3;overflow:hidden;border-radius:var(--r-card) var(--r-card) 0 0}
.case__img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.case:hover .case__img img{transform:scale(1.06)}
.case__cap{padding:20px clamp(18px,1.8vw,26px) clamp(20px,2vw,26px)}
.case__cap h3{font-size:clamp(17px,1.35vw,21px);font-weight:600;letter-spacing:-.015em;line-height:1.2;max-width:20ch}
.case__cap span{display:block;margin-top:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}

/* ============================================================
   REVIEWS — the one light section
   ============================================================ */
.rev{background:var(--cream);color:var(--ink)}
.rev .label{color:rgba(14,22,32,.42)}
.rev .lead{color:rgba(14,22,32,.62)}
.rev__score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.rev__score .display{color:var(--ink)}
.rev__stars{display:flex;gap:3px;margin-top:14px}
.rev__stars i{width:15px;height:14px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.rev__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.5vw,22px)}
.rq{background:var(--cream-2);border:1px solid var(--rule-ink);border-radius:var(--r-card);padding:clamp(22px,2.2vw,30px);display:flex;flex-direction:column;gap:16px}
.rq p{font-size:15.5px;line-height:1.5;color:rgba(14,22,32,.78)}
.rq footer{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(14,22,32,.5)}
.rq footer b{color:var(--ink);font-weight:600}
.rq__stars{margin-left:auto;display:flex;gap:2px;flex:none}
.rq__stars i{width:11px;height:10px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

/* ============================================================
   ARTICLES
   ============================================================ */
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.5vw,22px)}
.art a{display:flex;flex-direction:column;gap:18px}
.art figure{margin:0;aspect-ratio:16/10;border-radius:var(--r-card);overflow:hidden;background:var(--ink-2)}
.art figure img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.art a:hover figure img{transform:scale(1.05)}
.art h3{font-size:clamp(18px,1.5vw,23px);font-weight:600;letter-spacing:-.02em;line-height:1.22;max-width:22ch;transition:color .3s}
.art a:hover h3{color:var(--gold)}
.art time{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}

/* ============================================================
   CONTACT + TOP SELLERS
   ============================================================ */
.kont{background:var(--ink-2)}
.kont__grid{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(24px,3.5vw,64px);align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
.field{display:flex;flex-direction:column;gap:7px}
.field--full{grid-column:1/-1}
.field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}
.field input,.field textarea{
  width:100%;padding:15px 16px;background:var(--ink);border:1px solid var(--rule);
  border-radius:var(--r-card);font-size:16px;color:var(--cream);
  transition:border-color .25s,background .25s;
}
.field textarea{resize:vertical;min-height:104px}
.field input::placeholder,.field textarea::placeholder{color:rgba(245,239,215,.28)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:var(--ink-3)}
.form__foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:6px}
.ok{display:none;background:var(--ink);border:1px solid var(--gold);border-radius:var(--r-card);padding:clamp(24px,2.6vw,36px);margin-top:32px}
.ok.show{display:block;animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ok h3{font-family:var(--display);font-size:clamp(22px,2.2vw,32px);line-height:1.05;margin-bottom:12px}

.tops{position:sticky;top:96px}
.tops__stack{position:relative;margin-top:22px;border-radius:var(--r-card);overflow:hidden;background:var(--ink);aspect-ratio:4/3}
.tops__item{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease);pointer-events:none}
.tops__item.on{opacity:1;pointer-events:auto}
.tops__item img{width:100%;height:100%;object-fit:cover}
.tops__cap{
  position:absolute;inset:auto 0 0 0;padding:clamp(20px,2vw,28px);
  background:linear-gradient(180deg,rgba(10,16,24,0),rgba(10,16,24,.9) 62%);
  /* the outgoing caption clears out before the incoming one arrives,
     otherwise two stacked labels overlap mid-crossfade */
  opacity:0;transition:opacity .3s var(--ease);
}
.tops__item.on .tops__cap{opacity:1;transition-delay:.32s}
.tops__cap h3{font-size:clamp(19px,1.7vw,26px);font-weight:600;letter-spacing:-.02em}
.tops__cap span{display:block;margin-top:6px;font-size:13.5px;color:var(--dim)}
.tops__dots{display:flex;gap:7px;margin-top:16px}
.tops__dots button{width:26px;height:3px;border-radius:2px;background:var(--rule);transition:background .3s}
.tops__dots button.on{background:var(--gold)}

/* ============================================================
   FOOTER
   ============================================================ */
/* +--r-sec on top: the contact section's rounded bottom covers the footer's first 40px */
.foot{background:var(--ink-deep);border-radius:0;padding-block:calc(clamp(60px,6vw,96px) + var(--r-sec)) 34px}
.foot__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:clamp(24px,3vw,48px);padding-bottom:clamp(40px,4vw,64px);border-bottom:1px solid var(--rule)}
.foot h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim-2);margin-bottom:18px;font-weight:500}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.foot ul a{font-size:15px;color:var(--dim);transition:color .25s}
.foot ul a:hover{color:var(--cream)}
.foot__brand .logo{margin-bottom:18px}
.foot__brand p{font-size:15px;color:var(--dim);max-width:26ch}
.foot__bot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding-top:26px}
.foot__bot p,.foot__bot a{font-size:13px;color:var(--dim-2)}
.foot__bot a:hover{color:var(--gold)}
.credit{display:inline-flex;align-items:center;gap:8px}
.credit b{color:var(--cream);font-weight:600}

/* ============================================================
   AURIFER PLAQUE
   ============================================================ */
.plaque{
  position:fixed;right:var(--gut);bottom:20px;z-index:70;
  display:flex;align-items:center;gap:14px;
  padding:14px 14px 14px 20px;border-radius:var(--r-card);
  background:var(--gold);color:var(--ink);
  font-size:15px;font-weight:500;letter-spacing:-.01em;
  box-shadow:0 10px 34px rgba(0,0,0,.34);
  animation:pop .6s var(--ease) both 1.1s;
}
.plaque.hide{display:none}
.plaque a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.plaque a:hover{text-decoration-thickness:2px}
.plaque__dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.plaque__x{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:rgba(14,22,32,.5);font-size:19px;line-height:1;transition:.25s}
.plaque__x:hover{background:rgba(14,22,32,.12);color:var(--ink)}

/* ============================================================
   DEMO LOCK
   ============================================================ */
.page{transition:filter .55s var(--ease),transform .55s var(--ease)}
body.locked{overflow:hidden}
body.locked .page{filter:blur(22px) saturate(.8);transform:scale(1.03);pointer-events:none;user-select:none}
body.locked .plaque{display:none}
.lock{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:var(--gut);background:rgba(10,16,24,.55)}
.lock.show{display:flex;animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lock__card{
  background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r-sec);
  padding:clamp(34px,4vw,56px);max-width:520px;width:100%;text-align:center;
  animation:pop .55s var(--ease) both .05s;
}
.lock__badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:100px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.lock__crumb{margin-top:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2)}
.lock__card h2{font-family:var(--display);font-size:clamp(24px,2.6vw,36px);line-height:1.02;margin:14px 0 14px}
.lock__card p{font-size:15.5px;color:var(--dim);max-width:38ch;margin:0 auto 28px}

/* ============================================================
   MOBILE MENU
   ============================================================ */
.mm{position:fixed;inset:0;z-index:110;background:var(--ink);padding:16px var(--gut) var(--gut);display:none;flex-direction:column}
.mm.open{display:flex;animation:fade .3s var(--ease) both}
.mm__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.mm__close{width:42px;height:42px;border:1px solid var(--rule);border-radius:999px;font-size:20px}
.mm nav{display:flex;flex-direction:column;gap:4px}
.mm nav a{font-family:var(--display);font-size:clamp(28px,7vw,44px);line-height:1.1;padding:8px 0}
.mm__cta{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* ============================================================
   MOTION
   ============================================================ */
.rise{opacity:0;transform:translateY(20px);transition:opacity .85s var(--ease),transform .85s var(--ease)}
.rise.in{opacity:1;transform:none}
.rise[data-d="1"]{transition-delay:.09s}
.rise[data-d="2"]{transition-delay:.18s}
.rise[data-d="3"]{transition-delay:.27s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rise{opacity:1;transform:none}
  .hero{height:100vh!important}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1080px){
  .nav{display:none}
  .burger{display:flex}
  .grid3,.rev__grid,.art{grid-template-columns:1fr 1fr}
  .kont__grid,.zast__grid{grid-template-columns:1fr}
  .zast__media{min-height:clamp(260px,42vw,420px)}
  .foot__grid{grid-template-columns:1fr 1fr}
  .tops{position:static}
  .promo__grid{grid-template-columns:1fr 1fr}
  .promo__item:nth-child(3){grid-column:1/-1}
}
@media (max-width:720px){
  :root{--r-sec:28px}
  body{font-size:16px}
  .grid3,.art,.form,.foot__grid,.zast__cards{grid-template-columns:1fr}
  .hero{height:300vh}
  .hero h1{max-width:none}
  .plaque{left:12px;right:12px;bottom:12px;padding:13px 12px 13px 16px;font-size:14px}
  /* the burger menu carries the language switch and the CTA on small screens */
  .hdr .lang,.hdr__side > .btn{display:none}
  .hdr{padding:8px 8px 8px 14px}
  .logo__svg{height:22px}
  .hero__hint{display:none}
  .hero__inner{padding-bottom:clamp(70px,9vh,110px)}

  /* one benefit per row, each reading as a line rather than a column */
  .promo__grid{grid-template-columns:1fr;gap:30px}

  /* stacked title/body reads better than two narrow columns on a phone */
  .card__row{grid-template-columns:1fr;gap:10px}
  .card__body{gap:18px}

  /* full-width review cards with body-size type — the 2-up grid made them
     look like scraps of text on a phone */
  .rev__grid{grid-template-columns:1fr;gap:12px}
  .rq{padding:24px 22px}
  .rq p{font-size:17px;line-height:1.5}

  /* keep captions clear of the 16px corner curve */
  .case__cap{padding:20px 22px 24px}
  .tops__cap{padding:24px}

  /* section CTAs read better left-aligned once the heading owns the full width */
  .sec__head > :last-child{margin-left:0}
}
</style>

/* ============================================================
   HERO — scroll-driven frame sequence on canvas
   ============================================================ */
const FRAMES = 143;
const cv   = document.getElementById("seq");
const ctx  = cv.getContext("2d", {alpha:false});
const hero = document.querySelector(".hero");
const heroA = document.getElementById("heroA");
const heroB = document.getElementById("heroB");
const hint  = document.getElementById("hint");
const bar   = document.getElementById("bar");
const tint  = document.getElementById("tint");

const imgs   = new Array(FRAMES);
const loaded = new Uint8Array(FRAMES);
let curIdx = 0, dirty = true;

const src = i => "assets/hero/f"+String(i).padStart(3,"0")+".webp";

function load(i){
  if(imgs[i]) return;
  const im = new Image();
  im.decoding = "async";
  im.onload = ()=>{ loaded[i] = 1; dirty = true; };
  im.src = src(i);
  imgs[i] = im;
}

/* Load order: first frame, then a coarse pass so scrubbing works early,
   then everything else. Narrow screens only take every third frame. */
const step = window.innerWidth < 768 ? 3 : 1;
const order = [0];
for(let i=0;i<FRAMES;i+=12) order.push(i);
for(let i=0;i<FRAMES;i+=step) order.push(i);
let qi = 0, inflight = 0;
function pump(){
  while(inflight < 6 && qi < order.length){
    const i = order[qi++];
    if(imgs[i]) continue;
    inflight++;
    const im = new Image();
    im.decoding = "async";
    im.onload = im.onerror = ()=>{ loaded[i] = 1; inflight--; dirty = true; pump(); };
    im.src = src(i);
    imgs[i] = im;
  }
}
load(0); pump();

function nearest(i){
  if(loaded[i] && imgs[i] && imgs[i].naturalWidth) return i;
  for(let d=1;d<FRAMES;d++){
    const a = i-d, b = i+d;
    if(a>=0 && loaded[a] && imgs[a].naturalWidth) return a;
    if(b<FRAMES && loaded[b] && imgs[b].naturalWidth) return b;
  }
  return -1;
}

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(cv.clientWidth  * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  dirty = true;
}

function paint(){
  const i = nearest(curIdx);
  if(i < 0) return;
  const im = imgs[i];
  const cw = cv.width, ch = cv.height;
  const s = Math.max(cw/im.naturalWidth, ch/im.naturalHeight);
  const w = im.naturalWidth*s, h = im.naturalHeight*s;
  ctx.drawImage(im, (cw-w)/2, (ch-h)/2, w, h);
}

const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const range = (p,a,b)=>clamp((p-a)/(b-a),0,1);

let progress = 0;
function readScroll(){
  const total = hero.offsetHeight - window.innerHeight;
  const p = total > 0 ? clamp(-hero.getBoundingClientRect().top / total, 0, 1) : 1;
  if(p !== progress){ progress = p; dirty = true; }
}

function frameLoop(){
  if(dirty){
    dirty = false;
    curIdx = Math.round(progress * (FRAMES-1));
    paint();

    /* copy A hands over to copy B as the shade arrives */
    const outA = range(progress,.06,.34);
    heroA.style.opacity   = String(1-outA);
    heroA.style.transform = "translateY("+(outA*-26)+"px)";
    const inB = range(progress,.52,.78);
    heroB.style.opacity   = String(inB);
    heroB.style.transform = "translateY("+((1-inB)*26)+"px)";
    heroB.style.pointerEvents = inB > .5 ? "auto" : "none";

    hint.style.opacity = String(1 - range(progress,0,.12));
    bar.style.width    = (progress*100)+"%";
    tint.style.opacity = String(.18 + range(progress,.2,1)*.22);
  }
  requestAnimationFrame(frameLoop);
}

const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
sizeCanvas();
window.addEventListener("resize", ()=>{ sizeCanvas(); readScroll(); }, {passive:true});
window.addEventListener("scroll", readScroll, {passive:true});
if(reduced){ progress = 1; dirty = true; }
readScroll();
requestAnimationFrame(frameLoop);

/* ============================================================
   Header state
   ============================================================ */
const hdr = document.getElementById("hdr");
const lightSec = document.querySelector(".rev");
function headerState(){
  hdr.classList.toggle("stuck", window.scrollY > 40);
  const r = lightSec.getBoundingClientRect();
  hdr.classList.toggle("light", r.top < 64 && r.bottom > 0);
}
window.addEventListener("scroll", headerState, {passive:true});
headerState();

/* ============================================================
   Top sellers — advances on its own and whenever the visitor
   moves through the form next to it
   ============================================================ */
const items = [...document.querySelectorAll(".tops__item")];
const dots  = [...document.querySelectorAll("#topsDots button")];
let ti = 0, timer;
function show(n){
  ti = (n + items.length) % items.length;
  items.forEach((el,i)=>el.classList.toggle("on", i===ti));
  dots.forEach((el,i)=>el.classList.toggle("on", i===ti));
}
function auto(){ clearInterval(timer); timer = setInterval(()=>show(ti+1), 4500); }
dots.forEach((b,i)=>b.addEventListener("click", ()=>{ show(i); auto(); }));
auto();

const form = document.getElementById("form");
form.addEventListener("focusin", ()=>{ show(ti+1); auto(); });
form.addEventListener("submit", e=>{
  e.preventDefault();
  if(!form.reportValidity()) return;
  form.style.display = "none";
  document.getElementById("ok").classList.add("show");
});

/* ============================================================
   Demo lock — hash routing
   ============================================================ */
const lockEl  = document.getElementById("lock");
const crumbEl = document.getElementById("lockCrumb");
const mm      = document.getElementById("mm");
function closeMenu(){ mm.classList.remove("open"); }

function currentRoute(){
  const h = location.hash;
  return h.startsWith("#/") ? h.slice(1) : null;
}
function updateCrumb(){
  const r = currentRoute();
  if(!r || !crumbEl) return;
  const n = ROUTES[r];
  crumbEl.textContent = n ? n[lang === "cs" ? 0 : 1] : r;
}
function syncLock(){
  const r = currentRoute();
  if(r){
    updateCrumb();
    lockEl.classList.add("show");
    document.body.classList.add("locked");
    closeMenu();
    document.getElementById("lockBack").focus({preventScroll:true});
  }else{
    lockEl.classList.remove("show");
    document.body.classList.remove("locked");
  }
}
window.addEventListener("hashchange", syncLock);
document.getElementById("lockBack").addEventListener("click", ()=>{
  history.pushState("", document.title, location.pathname + location.search);
  syncLock();
});
lockEl.addEventListener("click", e=>{ if(e.target === lockEl) document.getElementById("lockBack").click(); });
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && document.body.classList.contains("locked")) document.getElementById("lockBack").click();
});

/* ============================================================
   Mobile menu · plaque · scroll reveal
   ============================================================ */
document.getElementById("burger").addEventListener("click", ()=>mm.classList.add("open"));
document.getElementById("mmClose").addEventListener("click", closeMenu);
mm.querySelectorAll("a").forEach(a=>a.addEventListener("click", closeMenu));

document.getElementById("plaqueX").addEventListener("click", ()=>{
  document.getElementById("plaque").classList.add("hide");
});

const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
},{rootMargin:"0px 0px -8% 0px",threshold:.05});
document.querySelectorAll(".rise").forEach(el=>io.observe(el));

/* ---- init ---- */
applyLang(lang);
syncLock();
</script>
</body>
